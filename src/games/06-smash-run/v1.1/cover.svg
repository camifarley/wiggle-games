<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="24" fill="#7ec8ff"/>
  <!-- the mountain at the top of the hill -->
  <polygon points="60,120 150,30 240,120" fill="#7d6e62"/>
  <polygon points="150,120 245,18 345,120" fill="#8c7a6b"/>
  <polygon points="222,42 245,18 268,42 256,48 245,38 234,50" fill="#ffffff"/>
  <polygon points="134,46 150,30 166,46 156,50 150,42 143,52" fill="#ffffff"/>
  <!-- the slope rolling down toward you -->
  <polygon points="0,300 400,300 400,150 290,112 110,112 0,150" fill="#e0a96d"/>
  <polygon points="0,300 120,300 160,112 110,112 0,150" fill="#c98f55"/>
  <polygon points="400,300 280,300 240,112 290,112 400,150" fill="#c98f55"/>
  <polygon points="188,112 212,112 270,300 130,300" fill="#f0c48a"/>
  <!-- speed streaks: rolling DOWN -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".7">
    <line x1="168" y1="130" x2="160" y2="150"/><line x1="236" y1="132" x2="246" y2="154"/>
    <line x1="120" y1="186" x2="104" y2="214"/><line x1="292" y1="190" x2="310" y2="218"/>
  </g>
  <!-- small boulder far up the hill -->
  <circle cx="214" cy="122" r="11" fill="#8d7b6a"/>
  <circle cx="210" cy="119" r="3.5" fill="#fff"/><circle cx="219" cy="119" r="3.5" fill="#fff"/>
  <circle cx="211" cy="120" r="1.6" fill="#222"/><circle cx="220" cy="120" r="1.6" fill="#222"/>
  <!-- medium boulder -->
  <circle cx="160" cy="168" r="22" fill="#9a8676"/>
  <circle cx="152" cy="162" r="6" fill="#fff"/><circle cx="168" cy="162" r="6" fill="#fff"/>
  <circle cx="154" cy="164" r="3" fill="#222"/><circle cx="170" cy="164" r="3" fill="#222"/>
  <!-- big boulder rolling right at you, mid-smash -->
  <polygon points="250,170 300,182 318,232 290,272 232,276 204,236 214,190" fill="#8d7b6a"/>
  <polygon points="250,170 300,182 272,208 214,190" fill="#a08f7e"/>
  <circle cx="246" cy="222" r="13" fill="#fff"/><circle cx="282" cy="222" r="13" fill="#fff"/>
  <circle cx="249" cy="225" r="6" fill="#222"/><circle cx="285" cy="225" r="6" fill="#222"/>
  <ellipse cx="266" cy="252" rx="12" ry="7" fill="#4a3424"/>
  <!-- smash burst -->
  <g fill="#ffcc33">
    <polygon points="330,200 352,188 344,210 368,214 346,222 356,244 334,230 324,252 320,228 300,232 316,214 304,196 324,204"/>
  </g>
  <g fill="#c9905a"><rect x="350" y="160" width="12" height="12" transform="rotate(25 356 166)"/><rect x="372" y="236" width="10" height="10" transform="rotate(-20 377 241)"/><rect x="320" y="150" width="9" height="9" transform="rotate(40 324 154)"/></g>
</svg>
