<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- v2.0 "Animal parade!": the ball rolling downhill with a parade of friends trotting behind, a cracking barn -->
  <rect width="400" height="300" fill="#86ccff"/>
  <polygon points="40,150 140,40 240,150" fill="#9fb5d8"/><polygon points="118,64 140,40 162,64 150,70 140,62 130,70" fill="#fff"/>
  <polygon points="220,150 310,60 400,150" fill="#a9bede"/>
  <polygon points="0,300 0,170 400,150 400,300" fill="#8fd45e"/>
  <polygon points="40,300 175,150 245,150 380,300" fill="#e8d6a8"/>
  <!-- the barn, cracking: roof flying off -->
  <g transform="translate(300,150)">
    <rect x="-34" y="-46" width="68" height="46" fill="#d9483b"/><rect x="-14" y="-28" width="28" height="28" fill="#fff"/>
    <path d="M-14,-28 L14,0 M14,-28 L-14,0" stroke="#d9483b" stroke-width="4"/>
    <path d="M-20,-46 L-12,-30 L-18,-18 M18,-46 L10,-34 L16,-22" stroke="#2a1a1a" stroke-width="3" fill="none"/>
    <polygon points="-38,-66 0,-92 38,-66" fill="#7a3b2b" transform="rotate(-18) translate(-12,-16)"/>
    <g fill="#ffcc33"><rect x="-44" y="-80" width="7" height="7"/><rect x="40" y="-70" width="6" height="6"/></g>
  </g>
  <!-- the parade: duck, chicken, sheep, cow, trotting behind the ball -->
  <g transform="translate(118,206)"><ellipse cx="0" cy="10" rx="13" ry="10" fill="#ffd93d"/><circle cx="7" cy="-4" r="7" fill="#ffd93d"/><rect x="12" y="-5" width="8" height="4" fill="#ff9f1c"/><circle cx="9" cy="-6" r="1.8" fill="#1b1140"/></g>
  <g transform="translate(90,230)"><ellipse cx="0" cy="8" rx="13" ry="12" fill="#fff"/><circle cx="7" cy="-8" r="8" fill="#fff"/><rect x="5" y="-20" width="5" height="7" fill="#ff3b3b"/><polygon points="14,-9 22,-7 14,-5" fill="#ff9f1c"/><circle cx="9" cy="-9" r="1.8" fill="#1b1140"/></g>
  <g transform="translate(58,250)"><circle cx="0" cy="6" r="16" fill="#f4f7ff"/><circle cx="-10" cy="2" r="9" fill="#f4f7ff"/><circle cx="10" cy="0" r="9" fill="#f4f7ff"/><rect x="12" y="-10" width="12" height="13" rx="3" fill="#3a2a2a"/><circle cx="19" cy="-5" r="1.8" fill="#fff"/></g>
  <g transform="translate(18,272)"><rect x="-20" y="-14" width="40" height="24" fill="#ff8fd0"/><circle cx="-10" cy="-6" r="4" fill="#fff"/><circle cx="8" cy="2" r="5" fill="#fff"/><rect x="18" y="-24" width="16" height="16" fill="#ff8fd0"/><circle cx="28" cy="-17" r="2" fill="#1b1140"/></g>
  <g fill="#ffe14d" font-family="sans-serif" font-size="14"><text x="128" y="186">♥</text><text x="96" y="208">♥</text><text x="66" y="226">♥</text></g>
  <!-- the ball with his porthole -->
  <g transform="translate(200,212)">
    <ellipse cx="0" cy="38" rx="36" ry="8" fill="#000" opacity=".2"/>
    <circle r="40" fill="#ff5ea8"/><path d="M-40,0 A40,40 0 0 0 40,0" fill="none" stroke="#fff" stroke-width="5"/>
    <rect x="-30" y="-34" width="9" height="66" fill="#ffe14d" transform="rotate(-20)"/><rect x="18" y="-34" width="9" height="66" fill="#ffe14d" transform="rotate(-20)"/>
    <circle r="24" fill="#1b1140" stroke="#fff" stroke-width="4"/>
    <circle cx="-8" cy="-4" r="3.8" fill="#fff"/><circle cx="8" cy="-4" r="3.8" fill="#fff"/><path d="M-10,7 Q0,16 10,7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g font-family="sans-serif" font-weight="900"><rect x="12" y="12" width="104" height="34" rx="17" fill="#1b1140" opacity=".8"/><text x="64" y="36" font-size="20" fill="#7dff6a" text-anchor="middle">🐾 12</text></g>
</svg>
