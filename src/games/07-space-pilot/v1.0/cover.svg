<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#3a2a8a"/><stop offset="1" stop-color="#0b0824"/></radialGradient>
    <radialGradient id="beam" cx="50%" cy="100%" r="100%"><stop offset="0" stop-color="#9fe8ff" stop-opacity=".9"/><stop offset="1" stop-color="#5ec8ff" stop-opacity=".15"/></radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="30" cy="30" r="1.5"/><circle cx="80" cy="60" r="1"/><circle cx="280" cy="40" r="1.6"/><circle cx="250" cy="90" r="1"/><circle cx="140" cy="20" r="1.2"/><circle cx="200" cy="140" r="1"/><circle cx="60" cy="120" r="1.3"/></g>
  <circle cx="275" cy="160" r="40" fill="#ff8fd0"/><ellipse cx="275" cy="160" rx="62" ry="12" fill="none" stroke="#ffd27a" stroke-width="5" transform="rotate(-15 275 160)"/>
  <!-- bad guy (voxel) zapped into cubes -->
  <g transform="translate(40 40)">
    <g fill="#b04dff"><rect x="0" y="0" width="8" height="8"/><rect x="8" y="0" width="8" height="8"/><rect x="64" y="0" width="8" height="8"/><rect x="72" y="0" width="8" height="8"/>
      <rect x="0" y="8" width="8" height="8"/><rect x="72" y="8" width="8" height="8"/><rect x="16" y="24" width="48" height="8"/><rect x="8" y="32" width="64" height="16"/><rect x="16" y="48" width="8" height="8"/><rect x="56" y="48" width="8" height="8"/></g>
    <rect x="24" y="32" width="10" height="10" fill="#fff"/><rect x="46" y="32" width="10" height="10" fill="#fff"/><rect x="28" y="36" width="5" height="5" fill="#1b1140"/><rect x="50" y="36" width="5" height="5" fill="#1b1140"/>
    <g fill="#ffe14d"><rect x="90" y="10" width="7" height="7" transform="rotate(20 93 13)"/><rect x="100" y="34" width="6" height="6"/><rect x="-14" y="40" width="7" height="7" transform="rotate(-30 -10 44)"/></g>
  </g>
  <!-- laser -->
  <line x1="160" y1="200" x2="85" y2="85" stroke="#ff7ad9" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <line x1="160" y1="200" x2="85" y2="85" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- tractor beam + rescued friend -->
  <polygon points="190,200 210,200 268,70 172,70" fill="url(#beam)"/>
  <g transform="translate(220 78)">
    <circle r="26" fill="#ff9ad5"/><circle cx="-10" cy="10" r="4" fill="#fff" opacity=".6"/><circle cx="12" cy="-12" r="4" fill="#fff" opacity=".6"/>
    <ellipse cx="-9" cy="-4" rx="7" ry="8" fill="#fff"/><ellipse cx="9" cy="-4" rx="7" ry="8" fill="#fff"/><circle cx="-8" cy="-2" r="4" fill="#1b1140"/><circle cx="10" cy="-2" r="4" fill="#1b1140"/>
    <path d="M -8 8 Q 1 16 10 8" stroke="#1b1140" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 24 -6 L 36 -22" stroke="#ff9ad5" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- cockpit frame + dashboard -->
  <path d="M0 0 H320 V6 Q160 26 0 6 Z" fill="#231b52"/>
  <path d="M0 0 L18 0 L9 176 L0 176 Z M320 0 L302 0 L311 176 L320 176 Z" fill="#231b52"/>
  <path d="M0 180 Q160 164 320 180 V200 H0 Z" fill="#2e2468" stroke="#78c8ff" stroke-width="1.5"/>
  <text x="160" y="196" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#5ee0ff">RESCUED!</text>
</svg>
