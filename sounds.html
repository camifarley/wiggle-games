<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1140" />
  <link rel="icon" href="./icon.svg" />
  <title>Sound Picker</title>
  <link rel="stylesheet" href="./src/sound-picker.css" />
</head>
<body>
  <header>
    <h1>🎧 Sound Picker</h1>
    <p>Tap <b>▶</b> to listen. Give each sound a <b>👍</b> or <b>👎</b>, and pick one <b>⭐ favorite</b> per row.
      <b>“Now”</b> is the sound the games use today.</p>
    <div class="bar">
      <span id="progress"></span>
      <button id="export" class="primary">💾 Export picks</button>
      <a href="./" class="ghost">⬅ Back to games</a>
    </div>
  </header>
  <main id="slots"></main>
  <footer>
    <label for="notes">Notes for Claude (what did you and the little sound designer think?)</label>
    <textarea id="notes" rows="4" placeholder="e.g. the boulder smashes all sound too heavy; he loved the boings"></textarea>
    <p class="credit">Candidate sounds: Kenney.nl audio packs, CC0 1.0 (public domain).</p>
  </footer>
  <script type="module" src="./src/sound-picker.js"></script>
</body>
</html>
